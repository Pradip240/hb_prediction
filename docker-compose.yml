  rppg_prediction:
    image: rppg-base
    container_name: rppg-prediction
    working_dir: /app
    volumes:
      - ./data:/data:ro
      - ./output:/output
      - ./common:/app/common:ro
      - ./prediction:/app/prediction:ro
      - ./hr_training:/app/hr_training:ro
      - ./hb_training:/app/hb_training:ro
    command: ["python", "prediction/predict.py", "--segments-dir", "/output/train_data",
              "--ppg-dir", "/data/ppg", "--out-dir", "/output/prediction",
              "--hr-model", "/output/hr_model/hr_model.pt", "--hb-model", "/output/hb_model/hb_model.pt",
              "--workers", "4"]

