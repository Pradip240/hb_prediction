  hr_prediction:
    image: rppg-signal-analysis
    container_name: rppg-hr
    entrypoint: ["python", "predict_hr.py"]
    volumes:
      - ./data:/data:ro
      - ./output:/output
      - ./signal_analysis:/app:ro
    command: ["--signals-dir", "/output/signals", "--ground-truth", "/data/ground_truth.csv",
              "--output-dir", "/output/hr"]


