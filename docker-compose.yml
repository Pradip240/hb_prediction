  rppg_prediction:
    image: rppg-base
    container_name: rppg-prediction
    working_dir: /app
    volumes:
      - ./data:/data:ro
      - ./output:/output
      - ./common:/app/common:ro
      - ./prediction:/app/prediction:ro
      - ./hr_model:/app/hr_model:ro
      - ./hb_model:/app/hb_model:ro
    command: ["python", "-m", "prediction.predict", "--dataset-dir", "/output/dataset", "--ppg-dir", "/data/ppg",
              "--manifest", "/output/dataset/segments_manifest.csv", "--out-dir", "/output/prediction",
              "--hr-model", "/output/hr_model", "--hb-model", "/output/hb_model", "--no-plot", "--workers", "1"]

