services:
  segmentation:
    image: rppg-segmentation
    container_name: rppg-segmentation
    volumes:
      - ./data:/data:ro
      - ./output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--input-dir", "/data/videos", "--output-dir", "/output/seg", "--device", "cuda"]

  landmarks:
    image: rppg-landmarks
    container_name: rppg-landmarks
    volumes:
      - ./data:/data:ro
      - ./output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
    command: ["--input-dir", "/data/videos", "--output-dir", "/output/landmarks"]

